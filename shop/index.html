<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinity Fragrances · Shop</title>
<meta name="description" content="Order original long-lasting perfumes from Infinity Fragrances. Pay on delivery or by mobile money.">
<meta name="theme-color" content="#3b0d1f">
<link rel="icon" href="../app/icon-192.png">
<link rel="apple-touch-icon" href="../app/icon-180.png">
<style>
:root{--bg:#fbeef0;--card:#fffafb;--ink:#2b1520;--muted:#8a6575;--line:#f1d6de;--acc:#d0507e;--deep:#9b3060;--grad:linear-gradient(135deg,#f08aac 0%,#d0507e 50%,#9b3060 100%);--good:#1b7f4c;--radius:16px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(900px 600px at 0% 0%,#ffe1ea 0%,transparent 60%),radial-gradient(800px 600px at 100% 30%,#ffd9c7 0%,transparent 55%),linear-gradient(160deg,#fff2f4 0%,#f6d3dd 100%) fixed;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 120px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
header img{width:58px;height:58px;border-radius:50%;box-shadow:0 6px 16px rgba(155,48,96,.25)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:26px;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:13.5px}
.card{background:rgba(255,250,251,.9);border:1px solid rgba(208,80,126,.18);border-radius:var(--radius);padding:16px;box-shadow:inset 0 1px 0 #fff,0 12px 30px -16px rgba(170,60,100,.45);margin-bottom:14px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 8px 20px -14px rgba(170,60,100,.5)}
.p[hidden]{display:none}
.img{aspect-ratio:1;border-radius:10px;background:#fff7f9;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.img img{width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:6px;left:6px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.nm{font-weight:700;font-size:14.5px;line-height:1.25}.sz{color:var(--muted);font-weight:500;font-size:12.5px}
.pr{font-weight:800;font-size:16px}.pr s{color:var(--muted);font-weight:500;font-size:13px;margin-right:4px}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:auto}
.step button{border:0;background:#fbe4ea;width:44px;height:40px;font-size:21px;font-weight:800;cursor:pointer;color:var(--ink)}
.step span{font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #8e2a52,0 10px 20px -8px rgba(170,60,100,.6)}
.btn.pri:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.btn.wa{background:#25d366;color:#fff;border-color:transparent}
.btn[disabled]{opacity:.55}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:956px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(43,21,32,.94);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 16px 40px -10px rgba(0,0,0,.45);z-index:10}
.bar[hidden]{display:none}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px;margin-bottom:10px}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg button{flex:1;min-width:130px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;cursor:pointer;color:var(--ink);text-align:left}
.seg button.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(208,80,126,.2)}
.seg small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:800;margin-top:8px}
.err{color:#b3261e;font-weight:600;min-height:1em}
.mut{color:var(--muted)}.small{font-size:13px}
.center{text-align:center}
.rc{max-width:420px;margin:0 auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);font-size:14.5px}
.rc .dash{border-top:1px dashed #c9b8bf;margin:12px 0}
.rc .ln{display:flex;justify-content:space-between}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;font-size:13px;background:#fbe4ea}
.pill.good{background:#dcf3e6;color:var(--good)}
@media print{body{background:#fff}.no-print{display:none!important}.rc{box-shadow:none}}
.badge.pre{left:auto;right:8px;background:#2a2621;color:#f3e7c6}
.ws{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px;font-size:11.5px;color:var(--muted)}.ws span{background:var(--bg);border-radius:6px;padding:2px 6px}.ws b{color:var(--ink)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tiers div{border:1px solid var(--line);border-radius:10px;padding:8px 4px}.tiers b{display:block;font-size:14px}.tiers span{font-size:11.5px;color:var(--muted)}.tiers p{grid-column:1/-1;margin:2px 0 0}
.tierline{display:block;font-size:11.5px;color:var(--acc);font-weight:700}
.paybox{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;margin:10px 0}
.paynum{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px dashed var(--acc);border-radius:10px;padding:10px 12px}.paynum span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.paynum b{font-size:22px;letter-spacing:.04em}.paynum small{color:var(--muted)}
.proof{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}.proof img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.seg.pays{flex-wrap:wrap}.seg.pays button{flex:1 1 30%}
</style>
</head>

  function payNote(o) {

  var form = {};

  function keep() { ['o-n', 'o-p', 'o-t', 'o-a', 'o-x', 'o-s', 'o-z', 'o-d', 'o-r'].forEach(function (id) { var el = $('#' + id); if (el) form[id] = el.value; }); }

    var dp = CAT.deposit == null ? 50 : CAT.deposit; if (payBy === 'cod' && dp > 0) { o.deposit = Math.round(o.total * dp) / 100; o.depositPct = dp; o.depositVia = depVia || ''; }

      db.doc('notify/owner').set({at: new Date().toISOString(), msg: 'New online order from ' + o.name + ': ' + money(o.total)}).catch(function () {});

  function showReceipt(token) {

      document.title = p.biz + ' · Receipt ' + p.no;
      $('#app').innerHTML = '<div class="rc"><div class="center"><img src="' + LOGO + '" alt="" style="width:64px;height:64px;border-radius:50%"><div style="font-family:Georgia,serif;font-size:24px;margin-top:6px">' + esc(p.biz) + '</div><div class="small mut">' + esc(p.phone || '') + '</div></div><div class="dash"></div>' +
        '<div class="ln small"><span>Receipt <b>' + esc(p.no) + '</b></span><span>' + fmtDate(p.date) + ' ' + esc(p.time || '') + '</span></div>' + (p.seller ? '<div class="small">Sold by: ' + esc(p.seller) + '</div>' : '') + '<div class="dash"></div>' +
        (p.lines || []).map(function (l) { return '<div style="padding:5px 0"><b>' + esc(l.name) + '</b><div class="ln mut"><span>' + l.qty + ' × ' + money(l.price) + '</span><span>' + money(l.qty * l.price) + '</span></div></div>'; }).join('') + '<div class="dash"></div>' +
        (p.discount ? '<div class="ln"><span>Discount</span><span>−' + money(p.discount) + '</span></div>' : '') + '<div class="ln" style="font-size:20px;font-weight:800"><span>TOTAL</span><span>' + money(p.total) + '</span></div>' + (p.pay ? '<div class="ln"><span>Paid by</span><span>' + esc(p.pay) + '</span></div>' : '') +
        '<div class="dash"></div><div class="center small">Thank you for shopping with us!</div></div><p class="center no-print" style="margin-top:16px"><button class="btn pri" onclick="window.print()">Save or print</button> <a class="btn" href="./">Visit our shop</a></p>';
    }).catch(function () { $('#app').innerHTML = '<div class="card center"><p>Could not open the receipt. Check your internet.</p></div>'; });
  }
  var ORDW = {unsub: null, last: '', id: ''};
  function myOrders() { try { return JSON.parse(localStorage.getItem('if-myorders') || '[]'); } catch (e) { return []; } }
  function rememberOrder(o) { try { var l = myOrders().filter(function (x) { return x.id !== o.id; }); l.unshift({id: o.id, no: o.no, at: o.at}); localStorage.setItem('if-myorders', JSON.stringify(l.slice(0, 5))); } catch (e) {} }
  var ST_TXT = {confirmed: 'Your order is confirmed', shipped: 'Your order is on the way', done: 'Your order was delivered. Thank you!', cancelled: 'Your order was cancelled'};
  function notifyStatus(o) {
    var t = (o.status === 'shipped' && o.method === 'pickup') ? 'Your order is ready to collect' : ST_TXT[o.status]; if (!t) return;
    var body = 'Order ' + o.no + (o.status === 'shipped' && o.courier && o.courier.name ? ' · Rider: ' + o.courier.name + ' ' + (o.courier.phone || '') : '');
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) {}

    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var opts = {body: body, icon: LOGO, tag: 'order-' + o.no, renotify: true};
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.showNotification(t, opts); else try { new Notification(t, opts); } catch (e) {} }).catch(function () {});
    else try { new Notification(t, opts); } catch (e) {}
  }
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  function notifBox() {

    if (Notification.permission === 'denied') return '<p class="small mut">Notifications are blocked in your browser settings. Keep this page open to see updates.</p>';
    return '<button class="btn" id="notif">🔔 Notify me when my order moves</button>';
  }
  function drawOrder(o, id) {
    var steps = [['new', 'Received'], ['confirmed', 'Confirmed'], ['shipped', o.method === 'pickup' ? 'Ready to collect' : 'On the way'], ['done', o.method === 'pickup' ? 'Collected' : 'Delivered']], at = o.status === 'cancelled' ? -1 : steps.findIndex(function (x) { return x[0] === o.status; });
    var tl = o.status === 'cancelled' ? '<p><span class="pill">This order was cancelled</span></p>' : '<div style="display:flex;gap:6px;margin:10px 0 14px">' + steps.map(function (x, i) { return '<div style="flex:1;text-align:center"><div style="height:8px;border-radius:8px;background:' + (i <= at ? 'var(--acc)' : 'var(--line)') + '"></div><div class="small" style="margin-top:6px;font-weight:' + (i === at ? '800' : '500') + ';color:' + (i <= at ? 'var(--ink)' : 'var(--muted)') + '">' + x[1] + '</div></div>'; }).join('') + '</div>';
    var c = o.courier, rider = (o.status === 'shipped' || o.status === 'done') && c && c.name ? '<div class="card" style="border:2px solid var(--acc)"><h3 style="margin:0 0 6px">🛵 Your rider</h3><p style="margin:0 0 4px;font-size:18px"><b>' + esc(c.name) + '</b></p>' + (c.vehicle ? '<p class="small mut" style="margin:0 0 4px">' + esc(c.vehicle) + '</p>' : '') + (c.eta ? '<p class="small" style="margin:0 0 8px">Expected: <b>' + esc(c.eta) + '</b></p>' : '') + (c.phone ? '<p style="margin:8px 0 0"><a class="btn pri" href="tel:' + esc(c.phone) + '">📞 Call ' + esc(c.name.split(' ')[0]) + '</a> <a class="btn wa" href="' + wa(c.phone, 'Hello ' + c.name.split(' ')[0] + ', I am ' + o.name + ', waiting for order ' + o.no + '.') + '">WhatsApp</a></p>' : '') + '</div>' : '';
    var note = (o.shipNote ? '<p class="small"><b>Note:</b> ' + esc(o.shipNote) + '</p>' : '') + (o.wantDate ? '<p class="small">' + (o.method === 'pickup' ? 'Collection' : 'Delivery') + ' date: <b>' + esc(fmtDate(o.wantDate)) + '</b></p>' : '') +
      (o.payBy === 'cod' && o.deposit ? '<p class="small">' + (o.depositPaid ? '✓ First payment of ' + money(o.deposit) + ' received. Pay ' + money(Math.round((o.total - o.deposit) * 100) / 100) + ' on ' + (o.method === 'pickup' ? 'collection' : 'delivery') + '.' : 'Waiting for your first payment of ' + money(o.deposit) + '.') + '</p>' : '') +
