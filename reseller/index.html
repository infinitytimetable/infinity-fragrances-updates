<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My account · Infinity Fragrances</title>
<meta name="description" content="Reseller account: report sales, pay, confirm stock">
<meta name="theme-color" content="#3b0d1f">
<link rel="icon" href="../app/icon-192.png">
<link rel="apple-touch-icon" href="../app/icon-180.png">
<style>
:root{--bg:#fbeef0;--card:#fffafb;--ink:#2b1520;--muted:#8a6575;--line:#f1d6de;--acc:#d0507e;--deep:#9b3060;--grad:linear-gradient(135deg,#f08aac 0%,#d0507e 50%,#9b3060 100%);--good:#1b7f4c;--bad:#b3261e;--warn:#9a6700;--radius:16px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(900px 600px at 0% 0%,#ffe1ea 0%,transparent 60%),radial-gradient(800px 600px at 100% 30%,#ffd9c7 0%,transparent 55%),linear-gradient(160deg,#fff2f4 0%,#f6d3dd 100%) fixed;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 130px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
header img{width:56px;height:56px;border-radius:50%;box-shadow:0 6px 16px rgba(155,48,96,.25)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:24px;margin:0;line-height:1.1}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13.5px}
.card{background:rgba(255,250,251,.92);border:1px solid rgba(208,80,126,.18);border-radius:var(--radius);padding:16px;box-shadow:inset 0 1px 0 #fff,0 12px 30px -16px rgba(170,60,100,.45);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;text-decoration:none;color:var(--ink);background:#fff;min-height:48px}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #8e2a52,0 10px 20px -8px rgba(170,60,100,.6)}
.btn.pri:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.btn.wa{background:#25d366;color:#fff;border-color:transparent}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55}
.btn.block{display:flex;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14.5px;margin-bottom:12px}
input,select,textarea{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px}
.pin{font-size:34px;letter-spacing:.5em;text-align:center;padding:14px 0 14px .5em;font-weight:800}
.err{color:var(--bad);font-weight:700;min-height:1.2em;margin:4px 0}
.mut{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:rgba(255,250,251,.92);border:1px solid rgba(208,80,126,.18);border-radius:14px;padding:12px}
.tile .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:20px;font-weight:800;margin-top:3px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.big{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid rgba(208,80,126,.2);border-radius:16px;padding:16px;background:#fff;cursor:pointer;font:inherit;color:var(--ink);margin-bottom:10px;box-shadow:0 10px 24px -16px rgba(170,60,100,.5);position:relative}
.big:active{transform:translateY(1px)}
.big .ic{font-size:30px;line-height:1}
.big b{display:block;font-size:17px}.big span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.big .bdg{position:absolute;right:14px;top:14px;background:var(--acc);color:#fff;border-radius:999px;font-weight:800;font-size:13px;padding:2px 9px}
.it{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;margin-bottom:10px;cursor:pointer}
.it.on{border-color:var(--acc);background:#fff4f8}
.ck{width:30px;height:30px;border-radius:8px;border:2px solid #d9b6c3;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:18px}
.it.on .ck{background:var(--acc);border-color:var(--acc)}
.it .nm{font-weight:800;font-size:15.5px;line-height:1.25}
.it .meta{color:var(--muted);font-size:13px;margin-top:2px}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px;width:max-content;background:#fff}
.step button{border:0;background:#fbe4ea;width:52px;height:46px;font-size:24px;font-weight:800;cursor:pointer;color:var(--ink)}
.step span{min-width:56px;text-align:center;font-weight:800;font-size:19px}
.it .amt{margin-left:auto;font-weight:800;text-align:right;white-space:nowrap}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sumrow:last-child{border:0}
.sumrow.total{font-size:20px;font-weight:800;border-top:2px solid var(--acc);border-bottom:0;margin-top:4px;padding-top:11px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 8px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--acc);background:#fff4f8;box-shadow:0 0 0 3px rgba(208,80,126,.15)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12.5px;background:#fbe4ea}
.pill.good{background:#dcf3e6;color:var(--good)}.pill.warn{background:#fff1cf;color:var(--warn)}.pill.bad{background:#fde1de;color:var(--bad)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(43,21,32,.95);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 16px 40px -10px rgba(0,0,0,.45);z-index:10}
.bar b{font-size:17px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;font-weight:800;color:var(--deep);cursor:pointer;padding:6px 0;margin-bottom:6px;font-size:15.5px}
.notice{border-left:5px solid var(--acc);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.notice.warn{border-color:#d49a00;background:#fffaf0}.notice.good{border-color:var(--good);background:#f3fbf6}.notice.bad{border-color:var(--bad);background:#fff6f5}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;border-bottom:2px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.n{text-align:right;white-space:nowrap}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(43,21,32,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fffafb;border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:760px){.sheet{align-items:center}.sheet>div{border-radius:20px}}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {

  var CFG = {"apiKey": "AIzaSyDWFimYe-ttYeVnyjySJF9G3WS2sXnJxuA", "authDomain": "infinity-fragrances.firebaseapp.com", "projectId": "infinity-fragrances", "storageBucket": "infinity-fragrances.firebasestorage.app", "messagingSenderId": "702795967020", "appId": "1:702795967020:web:8b9798de1561a5059e3f89"};

  var num = function (v) { var n = Number(v); return isFinite(n) ? n : 0; };

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var fmtDate = function (s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Number(m[3]) + ' ' + MON[Number(m[2]) - 1] + ' ' + m[1] : String(s || ''); };

  var today = function () { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };

  var MODES = {cash: 'Cash', mtn: 'MTN MoMo', airtel: 'Airtel Money', bank: 'Bank'};

  var k = (location.hash.match(/k=([a-z0-9]+)/i) || [])[1] || '';
  var app = $('#app'), db = null, doc = null, D = null, key = null, local = {}, V = {screen: 'lock', sold: {}, pay: {amount: '', mode: '', ref: '', proof: '', note: '', touched: false}, rq: {}, rn: {}}, busy = false, err = '';
  try { local = JSON.parse(localStorage.getItem('if-rl-' + k) || '{}'); } catch (e) {}

  if (!k) { app.innerHTML = '<div class="card"><p>This link is not complete. Ask the office to send it again.</p></div>'; return; }

  /* ---------- crypto: the figures are locked with the last 4 digits of the phone number ---------- */
  var te = new TextEncoder();

    return crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function (base) {

  }

  db.doc('rlinks/' + k).onSnapshot(function (s) {
    doc = s.exists ? s.data() : {on: false}; err = '';
    if (key && doc.ct) { openDoc(key).then(function (d) { D = d; draw(); }, function () { key = null; D = null; V.screen = 'lock'; draw(); }); return; }
    if (!key && doc.ct && local.pin && !V.triedSaved) { V.triedSaved = true; unlock(local.pin, true); return; }

  }, function () { app.innerHTML = '<div class="card"><p>Could not load. Check your internet and refresh.</p></div>'; });

  function unlock(pin, silent) {
    if (!/^\d{4}$/.test(pin)) { err = 'Type the 4 digits.'; draw(); return; }
    busy = true; if (!silent) draw();
    keyFor(pin).then(function (kk) { return openDoc(kk).then(function (d) { key = kk; D = d; local.pin = pin; keep(); V.screen = 'home'; busy = false; err = ''; draw(); }); })
      .catch(function () { busy = false; delete local.pin; keep(); err = silent ? '' : 'Those digits do not match. Use the last 4 digits of the phone number the office has for you.'; draw(); });
  }

  /* ---------- the numbers ---------- */
  function statusOf(no) { var l = (D && D.reports || []).filter(function (x) { return x.no === no; })[0]; return l || null; }
  function unresolved() { return Object.keys(local.sent).map(function (n) { return local.sent[n]; }).filter(function (x) { var st = statusOf(x.no); return st ? st.status === 'pending' : (Date.now() - new Date(x.at).getTime()) < 3 * 86400000; }); }

  function heldLeft() {
    var used = {}; pendingSettles().forEach(function (x) { (x.lines || []).forEach(function (l) { used[l.p] = (used[l.p] || 0) + l.q; }); });

  }

  }

  /* ---------- screens ---------- */
  function head(title, sub) { return '<header><img src="' + LOGO + '" alt=""><div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div></header>'; }
  function backBtn() { return '<button class="back" data-a="go" data-s="home">‹ Back</button>'; }
  function draw() {
    var y = window.pageYOffset;
    if (!doc) { app.innerHTML = '<div class="card center"><p class="mut">Loading…</p></div>'; return; }
    if (doc.on === false) { app.innerHTML = head(doc.biz || 'My account', '') + '<div class="card"><p><b>This link is turned off.</b></p><p class="mut">Ask the office for a new link.</p></div>'; return; }
    if (!doc.ct) { app.innerHTML = head(doc.biz || 'My account', '') + '<div class="card"><p><b>Your account is being set up.</b></p><p class="mut">Please try again in a few minutes.</p></div>'; return; }

  }
  function lockHTML() {

  function settleHTML() {
    var C = calc(), p = V.pay;

    h += '<div class="row" style="margin-bottom:10px"><button class="btn sm" data-a="allSold">All sold</button><button class="btn sm ghost" data-a="noneSold">Clear</button></div>';
    C.H.forEach(function (x) {
      var q = Math.min(x.qty, Math.max(0, Math.round(num(V.sold[x.p])))), on = q > 0;
      h += '<div class="it' + (on ? ' on' : '') + '" data-a="tick" data-p="' + esc(x.p) + '"><div class="ck">' + (on ? '✓' : '') + '</div><div style="flex:1"><div class="nm">' + esc(x.name) + (x.size ? ' ' + esc(x.size) + 'ml' : '') + '</div><div class="meta">You hold ' + x.qty + ' · ' + money(x.price) + ' each</div>' +
