<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinity Fragrances Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a rail of business books on the left (a scrolling tab strip on phones); each page = summary tiles, then the ledger */
  --bg:#f6f5f2; --surface:#ffffff; --ink:#191714; --muted:#6e675c; --line:#e6e1d6;
  --accent:#16130f; --accent-ink:#e9cf8f; --gold:#a67c2e; --soft:#f2ede1;
  --good:#1d7549; --bad:#b3372e; --warn:#9a6200;
  --font-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0d0b; --surface:#191714; --ink:#f1ece2; --muted:#a69d8e; --line:#332f28;
    --accent:#d9b465; --accent-ink:#14110c; --gold:#d9b465; --soft:#26221b;
    --good:#62c592; --bad:#f2817a; --warn:#e4ac4f; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0d0b; --surface:#191714; --ink:#f1ece2; --muted:#a69d8e; --line:#332f28;
  --accent:#d9b465; --accent-ink:#14110c; --gold:#d9b465; --soft:#26221b;
  --good:#62c592; --bad:#f2817a; --warn:#e4ac4f; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 12px 40px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.02;color:var(--ink);padding:0 8px 6px}
.brand img{width:52px;height:52px;flex:none}
.brand small{display:block;margin-top:6px;font:600 10.5px/1 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.grp{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 12px 6px}
#nav-links{margin-top:18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--gold)}
nav.rail a{display:block;margin-bottom:2px;padding:7px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--soft)}
nav.rail a.on{background:var(--soft);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--gold)}
.mobile-brand{display:none}
main{padding:26px clamp(16px,3vw,40px) 90px;min-width:0;max-width:1240px}
.status{font-size:12px;color:var(--muted);padding:0 12px;margin-top:18px}
.banner{background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px}
.banner:empty{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:sticky;top:0;z-index:20;height:auto;display:flex;gap:2px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  nav.rail .grp,nav.rail .brand,nav.rail .status{display:none}
  #nav-links{display:flex;gap:2px;margin-top:0}
  nav.rail a{white-space:nowrap;padding:6px 11px;font-size:14px}
  nav.rail a.on{box-shadow:inset 0 -2px 0 var(--gold)}
  .mobile-brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);margin-bottom:6px}.mobile-brand img{width:34px;height:34px}
  main{padding-top:16px}
}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.05}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--gold);font-weight:600;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.tile.hl{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.card h2{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.cols .card{margin-bottom:0}
.tw{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
table.t tr.sub td{background:var(--soft);font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)} .mut{color:var(--muted)}
.small{font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.acc{color:var(--accent);background:var(--soft)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.filters input,.filters select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.towns{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.town{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.town h3{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1}
.town .meta{font-size:12.5px;color:var(--muted)}
.town .nums{display:flex;gap:14px;font-size:13px}
.town .nums b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.town .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.bars{width:100%;height:auto;display:block}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,10,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:50;overflow:auto}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:18px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{width:min(880px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.m-head h2{font-family:var(--font-display);font-size:26px;font-weight:600}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--ink)}
form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
form input,form select,form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:500;width:100%}
form textarea{min-height:70px}
form fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 2px;margin:4px 0 12px}
form legend{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.lines-head,.line{display:grid;grid-template-columns:minmax(0,2.4fr) 80px 110px 34px;gap:8px;align-items:center}
.lines-head.noprice,.line.noprice{grid-template-columns:minmax(0,2.4fr) 90px 34px}
.lines-head.giftl,.line.giftl{grid-template-columns:minmax(0,2.4fr) 80px 70px 34px}
.giftbox{flex-direction:row !important;align-items:center;gap:5px !important;margin:0 !important;font-size:13px !important}
.giftbox input{width:auto}
.lines-head{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:4px 0}
.line{margin-bottom:8px}
.line input,.line select{padding:7px 8px}
@media (max-width:560px){.lines-head{display:none}.line,.line.noprice{grid-template-columns:1fr 1fr 34px;padding-bottom:8px;border-bottom:1px solid var(--line)}.line .line-prod{grid-column:1 / -1}.line.noprice .line-qty{grid-column:1 / 3}}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.m-err{color:var(--bad);font-weight:600;font-size:13.5px;margin:6px 0 0}
.m-err:empty{display:none}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.check{flex-direction:row !important;align-items:center;gap:8px !important}
.check input{width:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
#toast.err{background:var(--bad);color:#fff}
.levels .lv{display:grid;grid-template-columns:70px 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.statement-text{width:100%;min-height:200px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.tree{list-style:none;margin:0;padding-left:16px;border-left:2px solid var(--line)}
.tree li{padding:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.thumb{width:44px;height:58px;border:1px dashed var(--line);border-radius:6px;background:#fff;padding:0;cursor:pointer;flex:none;display:grid;place-items:center;font-size:10px;color:#8a8170;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.tool{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.tool{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:14px;margin:4px 0 10px}
.preview{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.docwrap{position:relative;margin:0 auto 18px;box-shadow:0 8px 28px rgba(0,0,0,.14);overflow:hidden}
.docwrap > .doc{position:absolute;left:0;top:0;transform-origin:top left}
.picks{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:10px}
.picks label{flex-direction:row !important;align-items:center;gap:8px !important;margin:0 !important;padding:4px 0;font-weight:500 !important;color:var(--ink) !important}
.picks input{width:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#st-canvas{max-width:100%;max-height:70vh;display:block;margin:0 auto;background:#fff;touch-action:none;cursor:crosshair;border-radius:6px}
.st-out[hidden]{display:none}
.st-out{display:block;max-width:100%;max-height:340px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=range]{width:100%;accent-color:var(--gold)}
/* printable documents: fixed brand colours, independent of the hub theme */
.doc{font-family:"Manrope",Arial,sans-serif;color:#16130f;background:#fff;overflow:hidden;box-sizing:border-box}
.doc *{box-sizing:border-box}
.doc .serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
.doc.t-black{background:#0f0d0a;color:#f3ead6}
.doc.t-blush{background:#f6e7e3;color:#3b2522}
a.btn{text-decoration:none;color:inherit}
.sign-card{max-width:420px;width:100%}.sign-tabs{display:flex;justify-content:center;margin:0 0 14px}.sign-tabs button{flex:1}.sign-note{background:var(--soft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;text-align:left;font-size:14px;margin:0 0 14px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cat-card{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}.cat-card[hidden]{display:none}
.cat-img{position:relative;aspect-ratio:1;background:#fff;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}.cat-img img{width:100%;height:100%;object-fit:contain}.cat-badge{position:absolute;top:6px;left:6px}
.cat-name{font-weight:700;font-size:14px;line-height:1.25}.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:auto;border:1px solid var(--line);border-radius:10px;overflow:hidden}.stepper button{border:0;background:var(--soft);width:42px;height:38px;font-size:20px;font-weight:800;cursor:pointer;color:var(--ink)}.stepper span{font-weight:800}
.cart-bar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.ad-list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}.ad-row{padding:6px 0;border-bottom:1px solid var(--line)}.ad-row:last-child{border:0}.ad-price{display:block;margin:4px 0 2px 26px}.ad-price input{width:140px}
.fb-form{max-width:440px}.fb-form label{color:var(--ink);font-size:14px}.fb-form input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.pw-wrap{position:relative;display:block}.pw-wrap input{padding-right:70px}.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.fb-btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}.fb-btns .btn{width:100%;justify-content:center;text-align:center}
.fb-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:13px}.fb-or::before,.fb-or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.gbtn{width:100%;justify-content:center;text-align:center;background:#fff;color:#1f1f1f;border:1px solid #dadce0}.btn.gbtn::before{content:"G";font-weight:900;color:#4285f4;margin-right:8px}
.res-wrap{max-width:760px;margin:0 auto}.res-head{display:flex;gap:12px;align-items:center;margin:4px 0 12px}.res-head img{width:52px;height:52px}
.res-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}.res-tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}.res-tabs button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
body.res-mode .rail{display:none}body.res-mode main{margin-left:0!important;max-width:none}
a[data-badge]:not([data-badge=""])::after{content:attr(data-badge);margin-left:6px;background:#c8323a;color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:800}
.lockwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;text-align:center;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin:16px 0 6px}.pinpad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}.pinpad button:active{transform:scale(.96)}
.rail-user{margin:16px 12px 4px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:6px}.rail-ver{margin:10px 12px;font-size:11.5px;color:var(--muted,#8a8478)}
.doc.t-red{background:#0a0a0a;color:#f5f1ea}
.ptile s,.cart-line s{opacity:.6;font-weight:500;margin-right:4px}.ptile .promo-tag,.cart-line .promo-tag{display:inline-block;background:#c8323a;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.doc .gold{color:#b8913f}.doc.t-black .gold{color:#d8b464}
.doc .rule{height:2px;background:linear-gradient(90deg,#b8913f,#e8cf8b,#b8913f)}
.doc .imgbox{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.doc .imgbox img{max-width:92%;max-height:92%;object-fit:contain}
.doc table{width:100%;border-collapse:collapse}
.doc th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6e675c;border-bottom:2px solid #16130f;padding:8px 6px}
.doc td{padding:9px 6px;border-bottom:1px solid #e6e1d6;font-size:14px}
.doc .n{text-align:right}
.doc .rh{font-size:12px;letter-spacing:.1em;font-weight:800;color:#16130f;margin:18px 44px 8px;text-transform:uppercase;height:18px}
.doc table.dn td{padding:6px 6px;line-height:1.35;height:36px;box-sizing:border-box}

.posl{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.posl{grid-template-columns:1fr}}
.posl input,.posl select,.scanrow input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.scanrow{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.scanrow input{flex:1}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:600px;overflow:auto;padding:2px}
.ptile{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.ptile:hover{border-color:var(--gold)}
.ptile img{width:100%;height:100px;object-fit:contain;background:#fff;border-radius:6px;margin-bottom:4px}
.ptile.out{opacity:.45}
.gold-t{color:var(--gold);font-weight:800}
.clock{text-align:right}
#pos-time{font:700 32px/1 var(--font-body);font-variant-numeric:tabular-nums}
#pos-date{color:var(--muted);font-size:13.5px;margin-top:4px}
.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto 86px 92px 26px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cart-line .n{text-align:right;font-variant-numeric:tabular-nums}
.cart-line input{padding:6px 7px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;font-weight:700}
.sumrow b{white-space:nowrap}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-variant-numeric:tabular-nums}
.sumrow label{font-weight:600}
.sumrow.total{font-size:26px;font-weight:800;border-top:2px solid var(--ink);margin-top:4px;padding-top:8px}
.btn.big{padding:12px 22px;font-size:16px;flex:1}
.calc-disp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:right;font:600 28px/1.2 var(--font-body);font-variant-numeric:tabular-nums;min-height:58px;overflow-wrap:anywhere}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc-keys button{padding:13px 0;font-size:19px;font-weight:700;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.calc-keys .op{background:var(--soft)}
.calc-keys .eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.calc-keys .z{grid-column:span 2}
@media (max-width:520px){.cart-line{grid-template-columns:1fr 86px auto 26px}.cart-line > div:first-child{grid-column:1/-1}.clock{text-align:left}}

:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.vizwrap{position:relative}
.viz{display:block;overflow:visible}
.viz text{font-family:var(--font-body)}
.viztip{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.5;pointer-events:none;white-space:nowrap}
.viztip .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.vizh{font-size:13px;font-weight:700;margin:0 0 6px}
.quote{border-left:3px solid var(--gold);background:var(--surface);border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:18px}
.quote .serif{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.2}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.quotes figure{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.quotes blockquote{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.25}
.quotes figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.advice details{border-bottom:1px solid var(--line);padding:8px 0}
.advice summary{cursor:pointer;font-weight:700}
.advice p{margin:6px 0 2px;color:var(--muted);font-size:14px}
.ins{padding:8px 0;border-bottom:1px solid var(--line)}
.ins p{margin:3px 0 0;color:var(--muted);font-size:14px}
#est-form label,#grow-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
#est-form input,#est-form select,#grow-form input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:500;width:100%}

.festive{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:12px;margin-bottom:16px;color:#fff;background:var(--fest-bg,#333)}
.festive .fi{font-size:24px;line-height:1}
.festive .small{opacity:.92}
.festive .btn{margin-left:auto;color:#fff;border-color:rgba(255,255,255,.5)}
:root[data-festive="christmas"]{--gold:#c8323a;--fest-bg:linear-gradient(100deg,#9e1b25,#c8323a 45%,#1e6b3f)}
:root[data-festive="christmas"] body{background-image:radial-gradient(circle at 20px 20px, color-mix(in srgb,#1e6b3f 10%,transparent) 2px, transparent 2.5px);background-size:44px 44px}
:root[data-festive="newyear"]{--gold:#c79a1c;--fest-bg:linear-gradient(100deg,#141b3a,#2b2f6b 55%,#a37a12)}
:root[data-festive="valentine"]{--gold:#d6336c;--fest-bg:linear-gradient(100deg,#a8164a,#d6336c 60%,#f08aa8)}
:root[data-festive="valentine"] body{background-image:radial-gradient(circle at 22px 22px, color-mix(in srgb,#d6336c 9%,transparent) 2.5px, transparent 3px);background-size:46px 46px}
:root[data-festive="women"]{--gold:#8a3fb0;--fest-bg:linear-gradient(100deg,#5b1f7a,#8a3fb0 60%,#c47fd8)}
:root[data-festive="easter"]{--gold:#7a5cc4;--fest-bg:linear-gradient(100deg,#6a4fb5,#8f7ad6 50%,#4fa889)}
:root[data-festive="mothers"]{--gold:#c2477a;--fest-bg:linear-gradient(100deg,#8f2c55,#c2477a 60%,#e58fb0)}
:root[data-festive="africa"]{--gold:#2e8540;--fest-bg:linear-gradient(100deg,#1d5e2b,#2e8540 50%,#d98b18)}
:root[data-festive="blackfriday"]{--gold:#d4a73c;--fest-bg:linear-gradient(100deg,#000,#1b1b1b 60%,#b8232c)}
:root[data-festive="independence"]{--gold:#198a00;--fest-bg:linear-gradient(100deg,#198a00 0 55%,#de2010 55% 70%,#111 70% 85%,#ef7d00 85%)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}

.bottombar,.drawer-sheet{display:none}
.grid2 > label:not(.chk),.grid3 > label:not(.chk){display:flex;flex-direction:column;gap:4px;font-weight:600}
.pos-float{display:none}

#upd-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:70;display:flex;gap:12px;align-items:center;justify-content:space-between;width:min(560px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:10px 12px 10px 14px;box-shadow:0 14px 40px -10px rgba(0,0,0,.35)}

  .bottombar a,.bottombar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:700;border-radius:12px;cursor:pointer;min-height:48px;justify-content:center}
  .bottombar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:600px){
  .tiles{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}

@media (min-width:861px) and (max-width:1100px){ .app{grid-template-columns:200px minmax(0,1fr)} .brand{font-size:18px} .brand img{width:42px;height:42px} }
/* drawer (the "More" menu on phones) */
.drawer-sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#modal.drawer-on{align-items:flex-end;padding:0}
.drawer-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.drawer-head img{width:40px;height:40px}.drawer-head b{font-family:var(--font-display);font-size:22px}
.drawer-grp{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 4px 6px}
.drawer-links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.drawer-links a{display:block;padding:11px 12px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.drawer-links a.on{outline:2px solid var(--gold)}
.drawer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
/* bigger text option */
:root[data-text="large"] body{font-size:17px}
:root[data-text="large"] .btn{font-size:15.5px}
:root[data-text="large"] table.t{font-size:15px}

/* ================= themes ("skins") ================= */
.look-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.look-opt{border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.look-opt.on{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.look-sw{height:74px;border-radius:11px;position:relative;overflow:hidden;margin-bottom:6px}
.look-sw i{position:absolute;left:10px;right:26px;top:12px;height:22px;border-radius:7px;background:rgba(255,255,255,.75);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.look-sw u{position:absolute;left:10px;width:44px;bottom:10px;height:16px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.look-opt b{font-size:13px;display:block}.look-opt span{font-size:11px;color:var(--muted)}

:root[data-skin]:not([data-skin="classic"]) nav.rail{background:var(--sk-rail);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid var(--sk-edge)}
:root[data-skin]:not([data-skin="classic"]) nav.rail a.on{background:var(--sk-grad);color:var(--sk-on,#fff);box-shadow:0 8px 18px -8px var(--sk-shadow)}
:root[data-skin]:not([data-skin="classic"]) .btn{border-radius:12px;border:1px solid var(--sk-edge);background:linear-gradient(180deg,var(--sk-card) 0%,var(--sk-card2) 100%);box-shadow:inset 0 1px 0 var(--sk-hi),0 2px 0 var(--sk-edge2),0 6px 14px -8px var(--sk-shadow);transition:transform .12s,box-shadow .12s}
:root[data-skin]:not([data-skin="classic"]) .btn.pri{background:var(--sk-grad);color:var(--sk-on,#fff);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 var(--sk-deep),0 10px 20px -8px var(--sk-shadow)}
:root[data-skin]:not([data-skin="classic"]) .btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--sk-hi),0 0 0 var(--sk-edge2)}

  --sk-card:rgba(28,25,58,.78);--sk-card2:rgba(20,18,44,.85);--sk-solid:#17152f;--sk-field:rgba(10,9,26,.6);--sk-edge:rgba(160,150,255,.18);--sk-edge2:rgba(0,0,0,.45);--sk-hi:rgba(255,255,255,.08);--sk-shadow:rgba(0,0,0,.7);--sk-deep:#3c2c9e;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const thisMonth = () => today().slice(0, 7);
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const monthLabel = m => new Date(m + '-01T00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'});
const addMonths = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
const money = n => `${S.settings.currency || 'K'} ${num(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
const signed = n => `<span class="${n < 0 ? 'neg' : ''}">${money(n)}</span>`;
const int = n => num(n).toLocaleString('en-US');
const byDate = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '').localeCompare(b.createdAt || '');

const PROVINCES = ['Central','Copperbelt','Eastern','Luapula','Lusaka','Muchinga','Northern','North-Western','Southern','Western'];
const CH = {cash:'Cash', momo:'Mobile money', bank:'Bank'};
const IN_CATS = ['Reseller remittance','Customer payment','Capital introduced','Loan received','Other income'];
const OUT_CATS = ['Expense','Supplier payment','Commission payout','Drawings','Loan repayment'];
const EXP_TYPES = ['Courier charges','Transport & fuel','Delivery & courier','Packaging & bottles','Advertising & printing','Airtime & data','Rent','Wages','Bank & mobile money charges','Office & supplies','Other'];
const CATEGORIES = ['Women','Men','Unisex','Body sprays','Oils','Gift sets','Other'];

/* ---------- state & storage ---------- */
const DEFAULT_SETTINGS = {
  businessName:'Infinity Fragrances', ownerName:'', phone:'', currency:'K',
  levels:[{type:'percent', value:2.5}],
  defaultCommType:'fixed', defaultCommValue:20, tierMin:200, tierFixed:20, tierPct:10, settlementDay:10, courier:'Platinum', tagline:'Smell good. Live infinitely.', lowStock:5,
  opening:{cash:0, momo:0, bank:0}, openingDate:''
};
const COLS = ['towns','resellers','products','moves','cash','dispatches','images','receipts','promos','customers','invoices','suppliers','payslips','logs'];
const S = {towns:{}, resellers:{}, products:{}, moves:{}, cash:{}, dispatches:{}, images:{}, receipts:{}, promos:{}, customers:{}, invoices:{}, suppliers:{}, payslips:{}, logs:{}, settings:{...DEFAULT_SETTINGS}};
let DB = null, MODE = 'connecting', DL = null;
const loaded = {};
const UI = {month: thisMonth(), town:'', status:'active', q:'', year: String(new Date().getFullYear())};

function setStatus(t){ $('#status').textContent = t; }
function banner(t){ const b = $('#banner'); if (b) b.textContent = t || ''; UI.banner = t || ''; }

let EMBED = null;
function loadLocal(){
  try { const el = document.getElementById('embedded-data'); if (el) EMBED = JSON.parse(el.textContent); } catch(e) { EMBED = null; }
  try { const raw = localStorage.getItem('if-hub-v1'); let o = raw ? JSON.parse(raw) : null;
    if (EMBED && (!o || o.offlineFrom !== EMBED.exportedAt)) { o = {...JSON.parse(JSON.stringify(EMBED)), offlineFrom:EMBED.exportedAt}; try { localStorage.setItem('if-hub-v1', JSON.stringify(o)); } catch(e) {} }
    if (o) { COLS.forEach(c => S[c] = o[c] || {}); S.settings = {...DEFAULT_SETTINGS, ...(o.settings || {})}; if (o.offlineFrom) S.offlineFrom = o.offlineFrom; } } catch(e) {}
}
let DESK_T = 0;
function saveLocal(){
  if (MODE === 'desktop' && window.IFDesktop) { clearTimeout(DESK_T); DESK_T = setTimeout(deskSave, 300); return; }
  try { localStorage.setItem('if-hub-v1', JSON.stringify(S)); } catch(e) { toast('This browser is out of space. Download a backup.', true); }
}
async function deskSave(){
  const logs = Object.values(S.logs); if (logs.length > 5000) logs.sort((a, b) => a.at.localeCompare(b.at)).slice(0, logs.length - 5000).forEach(e => delete S.logs[e.id]);
  try { const r = await window.IFDesktop.save(JSON.stringify({...snapshotData(), savedBy:'Infinity Fragrances Hub ' + APP_VERSION, savedAt:nowISO()})); UI.deskInfo = {...(UI.deskInfo || {}), ...r}; setStatus('Saved on this ' + DEV_NAME); }
  catch(e) { toast('Could not save to the records file: ' + (e.message || e), true); setStatus('Not saved!'); }
}

async function boot(){
  $('#rail-logo').src = LOGO;
  window.addEventListener('hashchange', () => { closeModal(); render(true); });
  render();
  if (window.IFDesktop) {
    MODE = 'desktop';
    try { const d = await window.IFDesktop.load(); if (d.data) { const o = JSON.parse(d.data); COLS.forEach(c => S[c] = o[c] || {}); S.settings = {...DEFAULT_SETTINGS, ...(o.settings || {})}; }
      if (d.base) { try { BASE = JSON.parse(d.base); } catch(e) { BASE = null; } } UI.deskInfo = d.info || {}; } catch(e) { UI.banner = 'Could not open the records file: ' + (e.message || e); }
    try { DCFG = (await window.IFDesktop.getConfig()) || {}; APP_ROLE = DCFG.appRole || ''; } catch(e) {}
    SESSION = null; try { sessionStorage.removeItem('if-session'); } catch(e) {}
    if (APP_ROLE !== 'reseller') LIC = await licCheck(); setStatus('Saved on this ' + DEV_NAME);
    if (APP_ROLE) fbStart(); render(true); updSchedule();
    window.addEventListener('beforeunload', () => { if (DESK_T) { clearTimeout(DESK_T); window.IFDesktop.saveSync && window.IFDesktop.saveSync(JSON.stringify({...snapshotData(), savedAt:nowISO()})); } });
    return;
  }
  for (let i = 0; i < 40 && !window.claude; i++) await sleep(100);
  try { DB = window.claude ? await window.claude.use('db') : null; } catch(e) { DB = null; }
  try { DL = window.claude ? await window.claude.use('downloads') : null; } catch(e) { DL = null; }
  if (!DB) {
    MODE = 'local'; loadLocal();
    setStatus('Saved on this device only');
    UI.banner = EMBED ? `Offline copy of your hub, saved ${new Date(EMBED.exportedAt).toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'})}. Changes made here stay on this device only and do not reach your online hub.` : 'Records here are saved only in this browser. Open the hub from its claude.ai link to keep them safely in your account.';
    render(); return;
  }
  MODE = 'live'; setStatus('Loading records…');
  const timer = setTimeout(() => { if (!allLoaded()) { UI.banner = 'Your records are taking a while to load. Check your internet connection; the hub keeps trying.'; render(); } }, 10000);
  COLS.forEach(c => {
    DB.collection(c).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = {...d.data(), id:d.id}; });
      S[c] = o; loaded[c] = true;
      if (allLoaded() && !snap.metadata.fromCache) { clearTimeout(timer); if (UI.banner && UI.banner.startsWith('Your records')) UI.banner = ''; setStatus('Saved to your account'); }
      schedule();
    }, err => { UI.banner = `Could not load ${c}: ${err.message || err.code}`; schedule(); });
  });
  DB.doc('settings/main').onSnapshot(d => {
    S.settings = {...DEFAULT_SETTINGS, ...(d.exists ? d.data() : {})}; loaded.settings = true; schedule();
    maybeSeed(); maybeUpdate();
  }, () => { loaded.settings = true; });
}
const allLoaded = () => COLS.every(c => loaded[c]);
/* One-time load of the catalogue that shipped with the hub (Oct 2026 catalogues). */
let seeding = false;
async function maybeSeed(){
  if (seeding || !DB || S.settings.seededOct26) return;
  for (let i = 0; i < 100 && !(allLoaded() && loaded.settings); i++) await sleep(200);
  if (S.settings.seededOct26) return; seeding = true;
  try {
    const r = await fetch('seed.json'); if (!r.ok) return; const seed = await r.json();

function baseComm(r, qty, price, rule){

function commFor(rid, qty, price, rule){
  const out = []; const r = S.resellers[rid]; if (!r) return out;

/* ---------- the books, computed ---------- */
function compute(){
  const store = {}, held = {}, agg = {}, acc = {}, customers = {}, suppliers = {}, hp = {}, hr = {}, storeLoc = {};
  const SL = (l, p, q) => { l = l || 'main'; const o = storeLoc[l] || (storeLoc[l] = {}); o[p] = (o[p] || 0) + q; };
  const A = r => acc[r] || (acc[r] = {sales:0, remit:0, earned:0, paid:0, lastRemit:'', firstSale:'', bottles:0});
  const G = p => agg[p] || (agg[p] = {purchased:0, issued:0, returned:0, soldDirect:0, soldRes:0, adjusted:0});
  const H = (r, p, q) => { held[r] = held[r] || {}; held[r][p] = (held[r][p] || 0) + q; };
  Object.values(S.products).forEach(p => { store[p.id] = num(p.openingStock); SL('main', p.id, num(p.openingStock)); G(p.id); });
  const moves = Object.values(S.moves).sort(byDate);
  for (const m of moves) {
    const q = num(m.qty), p = m.productId; if (!(p in store)) store[p] = 0;
    if (m.kind === 'transfer') { SL(m.from, p, -q); SL(m.to, p, q); continue; }
    if (['purchase', 'return', 'adjust'].includes(m.kind)) SL(m.loc, p, q); else if (m.kind === 'issue' || (m.kind === 'sale' && !m.resellerId)) SL(m.loc, p, -q);
    if (m.kind === 'purchase') { store[p] += q; G(p).purchased += q; if (m.paidVia === 'credit') suppliers[m.supplier || 'Unnamed supplier'] = (suppliers[m.supplier || 'Unnamed supplier'] || 0) + q * num(m.unitCost); }
    else if (m.kind === 'issue') { store[p] -= q; H(m.resellerId, p, q); G(p).issued += q; if (num(m.unitPrice)) { hp[m.resellerId] = hp[m.resellerId] || {}; hp[m.resellerId][p] = num(m.unitPrice); } hr[m.resellerId] = hr[m.resellerId] || {}; hr[m.resellerId][p] = m.commRule || ''; }
    else if (m.kind === 'return') { store[p] += q; H(m.resellerId, p, -q); G(p).returned += q; }
    else if (m.kind === 'adjust') { store[p] += q; G(p).adjusted += q; }
    else if (m.kind === 'sale') {
      const v = q * num(m.unitPrice);
      if (m.resellerId) { H(m.resellerId, p, -q); G(p).soldRes += q; const a = A(m.resellerId); a.sales += v; a.bottles += q; if (!a.firstSale || m.date < a.firstSale) a.firstSale = m.date; }
      else { store[p] -= q; G(p).soldDirect += q; if (m.paidVia === 'credit') customers[m.customer || 'Unnamed customer'] = (customers[m.customer || 'Unnamed customer'] || 0) + v; }
      (m.comm || []).forEach(c => { A(c.rid).earned += num(c.amount); });
    }
  }
  const o = S.settings.opening || {};
  const bal = {cash:num(o.cash), momo:num(o.momo), bank:num(o.bank)};
  for (const c of Object.values(S.cash)) {
    const a = num(c.amount);
    if (c.kind === 'in') bal[c.channel] = (bal[c.channel] || 0) + a;
    else if (c.kind === 'out') bal[c.channel] = (bal[c.channel] || 0) - a;
    else if (c.kind === 'transfer') { bal[c.channel] = (bal[c.channel] || 0) - a; bal[c.toChannel] = (bal[c.toChannel] || 0) + a; }
    if (c.kind === 'offset' && c.resellerId) { const x = A(c.resellerId); x.remit += a; x.paid += a; x.kept = (x.kept || 0) + a; if (c.date > x.lastRemit) x.lastRemit = c.date; continue; }
    if (c.resellerId && c.category === 'Reseller remittance') { const x = A(c.resellerId); x.remit += a; if (c.date > x.lastRemit) x.lastRemit = c.date; }
    if (c.resellerId && c.category === 'Commission payout') A(c.resellerId).paid += a;
    if (c.category === 'Customer payment' && c.customer) customers[c.customer] = (customers[c.customer] || 0) - a;
    if (c.category === 'Supplier payment' && c.supplier) suppliers[c.supplier] = (suppliers[c.supplier] || 0) - a;
  }
  let heldValue = 0, storeValue = 0, heldBottles = 0;
  for (const p in store) storeValue += Math.max(0, store[p]) * num(S.products[p]?.costPrice);
  for (const r in held) for (const p in held[r]) { heldValue += Math.max(0, held[r][p]) * num(S.products[p]?.costPrice); heldBottles += Math.max(0, held[r][p]); }
  for (const r in acc) { const a = acc[r]; a.owed = r2(a.sales - a.remit); a.due = r2(a.earned - a.paid); a.net = r2(a.owed - a.due); }
  return {store, held, agg, acc, bal, customers, suppliers, storeValue, heldValue, heldBottles, hp, hr, storeLoc};
}

function monthStats(m){
  const s = {sales:0, bottles:0, cogs:0, comm:0, expenses:0, other:0, writeoff:0, byType:{}, byRes:{}, byTown:{}};
  for (const x of Object.values(S.moves)) {
    if (x.kind === 'adjust' && num(x.qty) < 0 && x.date?.startsWith(m)) s.writeoff += -num(x.qty) * num(S.products[x.productId]?.costPrice);
    if (x.kind !== 'sale' || !x.date?.startsWith(m)) continue;
    const v = num(x.qty) * num(x.unitPrice);
    s.sales += v; s.bottles += num(x.qty); s.cogs += num(x.qty) * num(x.unitCost);
    (x.comm || []).forEach(c => s.comm += num(c.amount));
    const k = x.resellerId || '_direct'; s.byRes[k] = (s.byRes[k] || 0) + v;
    const t = x.resellerId ? (S.resellers[x.resellerId]?.townId || '_none') : '_direct'; s.byTown[t] = (s.byTown[t] || 0) + v;
  }
  for (const c of Object.values(S.cash)) {
    if (!c.date?.startsWith(m)) continue;
    if (c.kind === 'out' && c.category === 'Expense') { s.expenses += num(c.amount); const t = c.expType || 'Other'; s.byType[t] = (s.byType[t] || 0) + num(c.amount); }
    if (c.kind === 'in' && c.category === 'Other income') s.other += num(c.amount);
  }
  s.gross = s.sales - s.cogs; s.net = s.gross - s.comm - s.expenses - s.writeoff + s.other;
  return s;
}

const sDay = () => Math.min(28, Math.max(1, num(S.settings.settlementDay) || 10));
function lastDueDate(){ const t = today(), d = sDay(), m = t.slice(0, 7); const thisDue = `${m}-${pad(d)}`; return t >= thisDue ? thisDue : `${addMonths(m, -1)}-${pad(d)}`; }
function nextDueDate(){ const t = today(), d = sDay(), m = t.slice(0, 7); const thisDue = `${m}-${pad(d)}`; return t < thisDue ? thisDue : `${addMonths(m, 1)}-${pad(d)}`; }
/* Amount a reseller should already have settled: sales and commission dated before the last settlement day, less every payment made since. */
function arrears(rid){
  const cut = lastDueDate(); let x = 0;
  for (const m of Object.values(S.moves)) {
    if (m.kind !== 'sale' || !(m.date < cut)) continue;
    if (m.resellerId === rid) x += num(m.qty) * num(m.unitPrice);
    (m.comm || []).forEach(c => { if (c.rid === rid) x -= num(c.amount); });
  }
  for (const c of Object.values(S.cash)) {
    if (c.resellerId !== rid) continue;
    if (c.category === 'Reseller remittance') x -= num(c.amount);
    if (c.category === 'Commission payout') x += num(c.amount);
  }
  return r2(x);
}
/* What the stock still with a reseller should bring in once it is sold. */
function expectedFor(rid, C){
  const h = (C.held[rid] || {}), o = {bottles:0, value:0, own:0, team:0, cost:0};
  for (const [pid, q] of Object.entries(h)) {
    if (q <= 0) continue; const p = S.products[pid] || {}, price = num(C.hp?.[rid]?.[pid]) || num(p.sellPrice);
    o.bottles += q; o.value += q * price; o.cost += q * num(p.costPrice);
    commFor(rid, q, price, C.hr?.[rid]?.[pid]).forEach(c => { c.level ? o.team += c.amount : o.own += c.amount; });
  }
  const a = C.acc[rid] || {net:0};
  o.cash = r2(o.value - o.own); o.profit = r2(o.value - o.cost - o.own - o.team); o.owedNow = r2(a.net || 0); o.totalCash = r2(o.cash + (a.net || 0));
  return o;
}
function expectedAll(C){
  const t = {bottles:0, value:0, own:0, team:0, cost:0, cash:0, profit:0, owedNow:0, totalCash:0}, rows = [];
  const ids = new Set([...Object.keys(C.held), ...Object.keys(C.acc)]);
  for (const id of ids) { if (!S.resellers[id]) continue; const e = expectedFor(id, C); if (!e.bottles && Math.abs(e.owedNow) < 0.01) continue; rows.push([id, e]); for (const k in t) t[k] += e[k] || 0; }
  rows.sort((a, b) => b[1].totalCash - a[1].totalCash);
  return {rows, t};
}
function overdueList(C){
  const cut = lastDueDate(), t = today();
  return Object.keys(C.acc).filter(id => S.resellers[id]).map(id => ({id, owed:arrears(id), days:daysBetween(cut, t)})).filter(o => o.owed > 0.009).sort((a, b) => b.owed - a.owed);
}

/* Cash book */
PAGES.cashbook = C => {
  const m = UI.month, o = S.settings.opening || {};
  const bf = {cash:num(o.cash), momo:num(o.momo), bank:num(o.bank)};
  const all = Object.values(S.cash).filter(c => c.kind !== 'offset').sort(byDate);
  const eff = c => { const e = {cash:0, momo:0, bank:0}, a = num(c.amount);
    if (c.kind === 'in') e[c.channel] += a; else if (c.kind === 'out') e[c.channel] -= a; else { e[c.channel] -= a; e[c.toChannel] += a; } return e; };
  all.filter(c => c.date < m + '-01').forEach(c => { const e = eff(c); for (const k in bf) bf[k] += e[k]; });
  const rows = all.filter(c => c.date?.startsWith(m));
  const run = {...bf}, tin = {cash:0, momo:0, bank:0}, tout = {cash:0, momo:0, bank:0};
  const cell = v => v ? `<span class="${v > 0 ? 'pos' : 'neg'}">${v > 0 ? '+' : '−'}${money(Math.abs(v)).replace(/^\S+ /, '')}</span>` : '';
  const body = rows.map(c => { const e = eff(c); for (const k in run) { run[k] += e[k]; if (e[k] > 0) tin[k] += e[k]; else tout[k] -= e[k]; }
    const who = c.resellerId ? rName(c.resellerId) : (c.customer || c.supplier || '');
    const what = c.kind === 'transfer' ? `Transfer ${CH[c.channel]} → ${CH[c.toChannel]}` : (c.category === 'Expense' ? `Expense: ${c.expType || 'Other'}` : c.category);
    return `<tr><td>${fmtDate(c.date)}</td><td><b>${esc(what)}</b>${who ? ` · ${esc(who)}` : ''}${c.description ? `<div class="small mut">${esc(c.description)}</div>` : ''}</td><td class="n">${cell(e.cash)}</td><td class="n">${cell(e.momo)}</td><td class="n">${cell(e.bank)}</td><td>${btn('Delete', 'delCash', {id:c.id}, 'sm ghost danger')}</td></tr>`; }).join('');
  return head('Cash book', 'Three-column cash book: cash, mobile money and bank. Money in shows in green, money out in red.',
      btn('Money in', 'moneyIn', {}, 'pri') + btn('Money out', 'moneyOut') + btn('Transfer', 'transfer'))
    + `<div class="filters">${monthFilter()}</div>
    <div class="tiles">${tile('Cash', signed(C.bal.cash), 'balance now')}${tile('Mobile money', signed(C.bal.momo), 'balance now')}${tile('Bank', signed(C.bal.bank), 'balance now')}${tile('Total', signed(C.bal.cash + C.bal.momo + C.bal.bank), 'all channels', true)}</div>
    <div class="card"><div class="tw"><table class="t"><thead><tr><th>Date</th><th>Details</th><th class="n">Cash</th><th class="n">Mobile money</th><th class="n">Bank</th><th></th></tr></thead><tbody>
      <tr class="sub"><td>1 ${monthLabel(m)}</td><td>Balance brought forward</td><td class="n">${signed(bf.cash)}</td><td class="n">${signed(bf.momo)}</td><td class="n">${signed(bf.bank)}</td><td></td></tr>
      ${body || `<tr><td colspan="6" class="mut">No money in or out this month.</td></tr>`}
      </tbody><tfoot>
      <tr><td></td><td>Total in</td><td class="n pos">${money(tin.cash)}</td><td class="n pos">${money(tin.momo)}</td><td class="n pos">${money(tin.bank)}</td><td></td></tr>
      <tr><td></td><td>Total out</td><td class="n neg">${money(tout.cash)}</td><td class="n neg">${money(tout.momo)}</td><td class="n neg">${money(tout.bank)}</td><td></td></tr>
      <tr><td></td><td>Balance carried forward</td><td class="n">${signed(run.cash)}</td><td class="n">${signed(run.momo)}</td><td class="n">${signed(run.bank)}</td><td></td></tr>
    </tfoot></table></div></div>`;
};

        ${s.other ? `<tr><td>Add other income</td><td class="n">${money(s.other)}</td></tr>` : ''}

      <div class="card"><h2>Business position today</h2><table class="t"><tbody>

    <div class="card"><h2>Year by month <label class="small mut" for="f-year">Year <select id="f-year">${years.map(x => `<option ${x === y ? 'selected' : ''}>${x}</option>`).join('')}</select></label></h2>

let SUBMIT = null;
function modal(title, body, onSubmit, opt = {}){
  const el = $('#modal'); el.classList.remove('drawer-on');
  el.innerHTML = `<div class="sheet ${opt.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="m-head"><h2 id="m-title">${esc(title)}</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>

  el.hidden = false; SUBMIT = onSubmit; applyWhen();
  if (el.querySelector('#doc-prev') && !el.querySelector('[data-act=printDoc]')) { const a = el.querySelector('form .actions'); if (a) a.insertAdjacentHTML('afterbegin', btn('Print', 'printDoc', {}, 'sm')); }
  const first = el.querySelector('form input:not([type=hidden]):not([type=date]), form select'); if (first && !opt.nofocus) first.focus();

function closeModal(){ $('#modal').classList.remove('drawer-on'); $('#modal').hidden = true; $('#modal').innerHTML = ''; SUBMIT = null; }
function applyWhen(){

  f.querySelectorAll('[data-when]').forEach(w => {

function statement(rid){
  const ev = [];
  Object.values(S.moves).forEach(m => {
    if (m.kind !== 'sale') return;
    if (m.resellerId === rid) ev.push({date:m.date, c:m.createdAt, text:`Sold ${m.qty} × ${pName(m.productId)} @ ${money(m.unitPrice)}`, dr:num(m.qty) * num(m.unitPrice), cr:0});
    (m.comm || []).filter(c => c.rid === rid).forEach(c => ev.push({date:m.date, c:m.createdAt + 'c', text:c.level ? `Recruitment bonus: ${rName(m.resellerId)} sold ${m.qty} × ${pName(m.productId)}` : `Commission on ${m.qty} × ${pName(m.productId)}`, dr:0, cr:num(c.amount)}));
  });
  Object.values(S.cash).forEach(c => {
    if (c.resellerId !== rid) return;
    if (c.category === 'Reseller remittance') ev.push({date:c.date, c:c.createdAt, text:`Payment received (${CH[c.channel]})${c.description ? ' – ' + c.description : ''}`, dr:0, cr:num(c.amount)});
    if (c.category === 'Commission payout') ev.push({date:c.date, c:c.createdAt, text:`Commission paid (${CH[c.channel]})`, dr:num(c.amount), cr:0});
  });
  ev.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.c || '').localeCompare(b.c || ''));
  let bal = 0; ev.forEach(e => { bal = r2(bal + e.dr - e.cr); e.bal = bal; });
  return {rows:ev, bal};
}
function statementText(rid){
  const r = S.resellers[rid], C = compute(), a = C.acc[rid] || {sales:0, remit:0, earned:0, paid:0, owed:0, due:0, net:0};
  const h = Object.entries(C.held[rid] || {}).filter(([, v]) => v > 0);
  let own = 0, team = 0; Object.values(S.moves).forEach(m => (m.comm || []).forEach(c => { if (c.rid === rid) c.level ? team += num(c.amount) : own += num(c.amount); }));
  return `*${(S.settings.businessName || 'Infinity Fragrances').toUpperCase()}*
Statement for ${r.name} (${tName(r.townId)})
As at ${fmtDate(today())}

Perfume with you: ${h.reduce((t, [, v]) => t + v, 0)} bottles
${h.map(([p, v]) => `- ${pName(p)} × ${v}`).join('\n') || '- none'}

Value of perfume sold: ${money(a.sales)}
Paid to us: ${money(a.remit)}
Balance on sales: ${money(a.owed)}

Commission earned: ${money(a.earned)} (own ${money(own)}${team ? `, recruitment bonus ${money(team)}` : ''})
Commission already kept or paid: ${money(a.paid)}
Commission you keep now: ${money(Math.max(0, Math.min(a.due, a.owed)))}

${a.net >= 0 ? `AMOUNT TO PAY ON ${fmtDate(nextDueDate()).toUpperCase()}: ${money(a.net)}` : `WE OWE YOU: ${money(-a.net)}`}
Thank you for selling with us!`;
}
function waLink(phone, text){
  let p = String(phone || '').replace(/\D/g, '');
  if (p.startsWith('0')) p = '260' + p.slice(1); else if (p.length === 9) p = '260' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

function settleFill(){

  box.innerHTML = `<b>${esc(rName(rid))}</b>: sold ${money(a.sales)} in total and has paid ${money(a.remit)}, so owes <b>${money(a.owed)}</b> for sales. Commission due to them: <b>${money(a.due)}</b>. They should pay <b>${money(Math.max(0, a.owed - kept))}</b> after keeping their commission. ${h} bottle${h === 1 ? '' : 's'} stay with them for next month.${a.due > a.owed + 0.009 ? ` Their commission is more than they owe, so pay them the extra ${money(a.due - a.owed)} with Pay commission.` : ''}`;

function shrinkImage(file, max = 1000, limit = 170000){
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(Error('Could not read the photo.')); r.onload = () => { const im = new Image(); im.onerror = () => rej(Error('That file is not a photo.')); im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    let q = 0.75, d = c.toDataURL('image/jpeg', q); while (d.length > limit && q > 0.35) { q -= 0.1; d = c.toDataURL('image/jpeg', q); } res(d); }; im.src = r.result; }; r.readAsDataURL(file); });
}

const lastCloudBk = () => { try { return localStorage.getItem('if-cloudbk') || ''; } catch(e) { return ''; } };
function cloudBackupDue(){ const l = lastCloudBk(); if (!l) return true; const h = (Date.now() - new Date(l)) / 3600000; return (new Date().getHours() >= 18 && iso(new Date(l)) !== today()) || h > 26; }
async function cloudBackup(manual){
  if (FB_ROLE !== 'owner' || CB_BUSY) { if (manual && FB_ROLE !== 'owner') toast('Sign in to your owner account first.', true); return; } CB_BUSY = true;
  try {
    const txt = JSON.stringify({...snapshotData(), savedBy:'Infinity Fragrances Hub ' + APP_VERSION, savedAt:nowISO()}), SZ = 600000, n = Math.max(1, Math.ceil(txt.length / SZ));
    const id = nowISO().replace(/[-:]/g, '').slice(0, 15);
    for (let i = 0; i < n; i += 6) { const ops = []; for (let j = i; j < Math.min(n, i + 6); j++) ops.push(['set', `backups/${id}/parts/${j}`, {d:txt.slice(j * SZ, (j + 1) * SZ)}]); await FB.batch(ops); }
    await FB.set(`backups/${id}`, {at:nowISO(), parts:n, size:txt.length, version:APP_VERSION, device:DESK ? DEV_LABEL : 'Online', records:COLS.reduce((t, c) => t + Object.keys(S[c] || {}).length, 0)});
    const all = (await FB.list('backups')).sort((a, b) => b.id.localeCompare(a.id));
    for (const old of all.slice(7)) { for (let j = 0; j < num(old.parts); j++) await FB.del(`backups/${old.id}/parts/${j}`); await FB.del('backups/' + old.id); }
    try { localStorage.setItem('if-cloudbk', nowISO()); } catch(e) {}
    if (manual) { toast('Backed up to your online account'); if (route() === 'setup') render(true); }
  } catch(e) { if (manual) toast('Online backup failed: ' + fbMsg(e), true); }
  CB_BUSY = false;
}
setInterval(() => { if (FB_ROLE === 'owner' && cloudBackupDue()) cloudBackup(false); }, 15 * 60000);

const UPD_URL = 'https://raw.githubusercontent.com/infinitytimetable/infinity-fragrances-updates/main/';
const UPD_KEY = {"kty": "EC", "crv": "P-256", "x": "eYSbfdTjRzEzKBMT_bv2vSLiTKvtLfTL6LzBj4nAsR0", "y": "eGXkBX5zAeGsTx0lKN1V71QOKBVZw_JVIheE3BNXGp4"};
const cmpV = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const p = x[i] || 0, q = y[i] || 0; if (p !== q) return p > q ? 1 : -1; } return 0; };
const updPlat = () => window.IFAndroid ? 'android' : 'desktop';
const canAutoUpdate = () => !!(DESK && MODE === 'desktop' && DESK.installUpdateText);
let UPD = {state:'', ver:'', notes:[], busy:false};
async function updVerify(txt, b64){
  const key = await crypto.subtle.importKey('jwk', UPD_KEY, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
  const sig = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, key, sig, new TextEncoder().encode(txt));
}
async function checkUpdate(manual){
  if (!canAutoUpdate()) { if (manual) toast('Automatic updates work in the phone and PC apps.', true); return; }
  if (UPD.busy) return; UPD.busy = true; if (manual) toast('Checking for updates…');
  try {
    const m = await (await fetch(UPD_URL + 'version.json?t=' + Date.now(), {cache:'no-store'})).json(), p = m[updPlat()];
    if (!p || cmpV(m.version, APP_VERSION) <= 0) { UPD.state = 'latest'; if (manual) toast(`You have the latest version (${APP_VERSION}).`); return; }
    const shell = String(await (DESK.shellVersion ? DESK.shellVersion() : '0'));
    if (p.minShell && cmpV(shell, p.minShell) < 0) { UPD = {...UPD, state:'shell', ver:m.version, notes:m.notes || []}; updBar(); return; }
    if (UPD.state === 'ready' && UPD.ver === m.version) { updBar(); return; }
    const txt = await (await fetch(UPD_URL + p.file, {cache:'no-store'})).text();
    if (!(await updVerify(txt, p.sig))) throw Error('The update did not pass its security check, so it was not installed. It will try again later.');
    const r = await DESK.installUpdateText(txt); if (!r || r.error) { if (r && /already have/.test(r.error)) { UPD.state = 'latest'; if (manual) toast(r.error); return; } throw Error((r && r.error) || 'Could not install the update.'); }
    UPD = {...UPD, state:'ready', ver:m.version, notes:m.notes || []}; logWrite && logWrite('update', `Downloaded version ${m.version}`); updBar();
  } catch(e) { if (manual) toast(/fetch|network|Failed/i.test(e.message) ? 'Could not reach the update server. Check your internet.' : e.message, true); }

}

Nthawi zina, Kampani ingagwirizane ndi Wogulitsa pa komishoni yomwe idzaperekedwe.
Komishoni imachotsedwa pa nthawi yolipira, ndipo imapezeka pa mabotolo okhawo amene agulitsidwa ndi kulipiridwa.
# Kulembetsa ena
Wogulitsa amene walembetsa munthu wina kukhala wogulitsa adzalandira bonasi ya 2.5% ya mtengo wogulitsira pa botolo lililonse logulitsidwa ndi munthuyo.
Bonasiyi imaperekedwa ndi Kampani, kuwonjezera pa komishoni ya wolembetsedwayo, wolembetsedwayo akalipira mabotolo amene wagulitsa.
Bonasiyi ndi ya anthu amene walembetsa iye mwini basi, osati anthu olembetsedwa ndi wolembetsedwayo.
# Kulipira
Pofika pa tsiku la {dayn} mwezi uliwonse, Wogulitsa azilipira mabotolo onse ogulitsidwa, kuchotsa komishoni, ndi ndalama, pa mobile money kapena kudzera ku banki.
Malipiro osalandiridwa pofika pa tsiku la {gracen} la mwezi ndi ochedwa. Palibe katundu watsopano amene adzatumizidwe pamene malipiro ali ochedwa.
Ngati malipiro achedwa kwa miyezi iwiri, Wogulitsa adzaimitsidwa ndipo katundu yense wosagulitsidwa adzabwezedwa.
# Ndalama zotumizira
{business} imalipira ndalama zotumizira katundu kwa Wogulitsa. Ndalama zobwezera katundu ku {business} zimagawidwa mofanana (50/50) pakati pa {business} ndi Wogulitsa.
# Kutha kwa mgwirizano
Mgwirizanowu upitirira mpaka mbali imodzi itauthetsa popereka chidziwitso cha masiku {notice} mwa kulemba. Uthenga wa WhatsApp umatengedwa ngati kulemba.
Pasanathe masiku {settle} mgwirizano utatha, Wogulitsa azibweza mabotolo onse osagulitsidwa ndi kulipira ndalama zonse zotsala za mabotolo ogulitsidwa, otayika kapena owonongeka.`},
bem:{name:'Bemba', title:'Icipangano ca Kashitisha', head:'Ukupilibula mu ciBemba', intro:'Icipangano ici capangwa pakati ka {business} (“Kampani”) na kashitisha uulembwa pa muulu (“Kashitisha”).', declare:'Bonse babili babelenga icipangano ici, bacumfwikisha kabili basumina ukucikonka. Uli onse akasunga kopi iyasainwa.', gov:'Nga iciNgeleshi ne ciBemba fyapusana, iciNgeleshi e cikonkwa.', company:'Kampani', reseller:'Kashitisha', nm:'Ishina', sign:'Ukusaina', date:'Ubushiku', agree:'Icipangano',

Kashitisha alalanda icishinka kabili bwangu pa fyonse ifyashitishiwa, ifyapeelwa kuli bakashita pa nkongole, na pa filalamuka bakashita.
# Komishoni
Kampani ili na nsambu ya kuteka komishoni ya Kashitisha. Komishoni tayakabe pa nshi ya 10% nangu pa muulu wa 25% ya mutengo wa kushitishishako pa botolo limo limo.
Inshita shimo, Kampani kuti yasuminishanya na Kashitisha pa komishoni iyo bakalipila.

toi:{name:'Tonga', title:'Cizuminano ca Musambazi', head:'Kusandulula mu Citonga', intro:'Cizuminano eeci cacitwa akati ka {business} (“Kkampani”) a musambazi walembwa atala (“Musambazi”).', declare:'Boonse bobilo babala cizuminano eeci, bacimvwisisya alimwi bazumina kucitobela. Umwi aumwi uyoobamba kkopi iisainidwe.', gov:'Kuti Cikuwa a Citonga zyaindana, Cikuwa ncecitobelwa.', company:'Kkampani', reseller:'Musambazi', nm:'Zina', sign:'Kusaina', date:'Buzuba', agree:'Cizuminano',

Kkampani ilijisi nguzu yakubikka komisoni ya Musambazi. Komisoni taiyoobi ansi aa 10% naa atala aa 25% yamuulo wakusambalila wabbotolo limwi alimwi.
Ziindi zimwi, Kkampani ilakonzya kuzuminana a Musambazi kujatikizya komisoni iyoobbadelwa.

  async d => {

    for (const [k, v] of Object.entries(d)) if (k.startsWith('sold_') && num(v) > 0) { const p = k.slice(5), q = Math.round(num(v)); if (q > (h2[p] || 0)) throw Error(`${r.name} holds only ${h2[p] || 0} × ${pName(p)}.`); lines.push({p, q}); }

function settleCalc(){

const ZX_SRCS = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js'];
async function loadAny(srcs){ let err; for (const s of srcs) { try { await loadScript(s); if (window.ZXing) return; } catch(e) { err = e; } } throw err || Error('Barcode reader could not load.'); }
const findByBarcode = code => Object.values(S.products).find(p => String(p.barcode || '').trim() === String(code).trim());
function drawScaled(img, max, rot){
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement('canvas'), x = c.getContext('2d');
  if (rot) { c.width = h; c.height = w; x.translate(h / 2, w / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h); }
  else { c.width = w; c.height = h; x.drawImage(img, 0, 0, w, h); }
  return c;
}
async function decodeBarcode(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    if ('BarcodeDetector' in window) { try { const r = await new window.BarcodeDetector().detect(img); if (r && r[0]) return r[0].rawValue; } catch(e) {} }
    await loadAny(ZX_SRCS);
    const Z = window.ZXing, hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader(); reader.setHints(hints);
    for (const max of [1400, 900, 2200]) for (const rot of [0, 90]) {
      try { const c = drawScaled(img, max, rot); return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText(); } catch(e) {}
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- per-reseller summary report (paged A4) ---------- */
function pagedDoc({title, firstTop, firstH, blocks}){
  const PAGE = 1123, CAP = PAGE - 80, CONT_H = 120, ROW = 36, TITLE = 44, THEAD = 34;
  const contTop = `<div style="display:flex;align-items:center;gap:14px;padding:34px 44px 16px"><img src="${LOGO}" style="width:44px;height:44px" alt=""><div class="serif" style="font-size:22px">${esc(title)} <span style="font-family:Manrope,Arial,sans-serif;font-size:13px;color:#6e675c;font-weight:600">continued</span></div></div><div class="rule" style="margin:0 44px 10px"></div>`;
  const pages = []; let cur = {html:firstTop, used:firstH};
  const newPage = () => { pages.push(cur.html); cur = {html:contTop, used:CONT_H}; };
  for (const b of blocks) {
    if (b.html != null) { if (cur.used + b.h > CAP) newPage(); cur.html += b.html; cur.used += b.h; continue; }
    let rows = b.rows.slice(), first = true;
    if (!rows.length) { const h = TITLE + 40; if (cur.used + h > CAP) newPage(); cur.html += `<div class="rh">${esc(b.title)}</div><div style="padding:0 44px;font-size:13px;color:#6e675c">${esc(b.empty || 'Nothing yet.')}</div>`; cur.used += h; continue; }
    while (rows.length) {
      let n = Math.floor((CAP - cur.used - TITLE - THEAD - (b.foot ? ROW : 0)) / ROW);
      if (n < 1) { newPage(); continue; }
      const take = rows.splice(0, n), last = !rows.length;
      cur.html += `<div class="rh">${esc(b.title)}${first ? '' : ' <span style="font-weight:600;color:#8a8170;letter-spacing:0;text-transform:none">continued</span>'}</div><div style="padding:0 44px"><table class="dn"><thead>${b.head}</thead><tbody>${take.join('')}${last && b.foot ? b.foot : ''}</tbody></table></div>`;
      cur.used += TITLE + THEAD + take.length * ROW + (last && b.foot ? ROW : 0); first = false;
      if (rows.length) newPage();
    }
  }
  pages.push(cur.html);
  const N = pages.length, foot = i => `<div style="position:absolute;left:44px;right:44px;bottom:26px;display:flex;justify-content:space-between;font-size:11px;color:#8a8170"><span>${[S.settings.businessName, bizPhone(), bizEmail(), bizAddress()].filter(Boolean).map(esc).join(' · ')}</span><span>${N > 1 ? `Page ${i + 1} of ${N}` : ''}</span></div>`;
  return pages.map((h, i) => `<div class="doc" data-w="794" data-h="1123" style="width:794px;height:1123px;position:relative">${h}${foot(i)}</div>`);
}

function easterDate(y){ const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da); }
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const FESTIVALS = {
  christmas:{name:'Christmas', greet:'Merry Christmas from Infinity Fragrances', tip:'Gift season: perfumes and gift sets sell fastest now. Make sure every reseller is stocked before the 20th.', icon:'❄'},
  newyear:{name:'New Year', greet:'Happy New Year!', tip:'A fresh year: review last year’s report and set this year’s monthly profit target on the Prospects page.', icon:'✦'},
  valentine:{name:'Valentine’s', greet:'Valentine’s season', tip:'Perfume is a top Valentine’s gift. Push couples’ offers and pink, sweet scents this fortnight.', icon:'♥'},
  women:{name:'Women’s Day', greet:'Happy International Women’s Day', tip:'Celebrate your resellers. Most of your team are women building their own income.', icon:'✿'},
  easter:{name:'Easter', greet:'Happy Easter', tip:'Easter holidays bring travel and visits. Remind resellers that settlement still falls on the 10th.', icon:'✿'},
  mothers:{name:'Mother’s Day', greet:'Mother’s Day is coming', tip:'Mother’s Day gifts: feature women’s fragrances on a flyer this week.', icon:'♥'},
  africa:{name:'Africa Day', greet:'Happy Africa Day', tip:'Ubuntu: I am because we are. Thank your resellers today.', icon:'✦'},
  blackfriday:{name:'Black Friday', greet:'Black Friday weekend', tip:'Biggest shopping weekend of the year: post your Black Friday advert every day until Monday and keep the Point of sale open.', icon:'%'},
  independence:{name:'Independence Day', greet:'Happy Independence Day, Zambia', tip:'Holiday weekend: a good time for a special offer flyer.', icon:'★'}

function festivalFor(dstr){
  const d = new Date(dstr + 'T00:00'), y = d.getFullYear(), md = dstr.slice(5);
  const between = (a, b) => md >= a && md <= b;
  if (between('12-31', '12-31') || between('01-01', '01-06')) return 'newyear';
  if (between('12-01', '12-30')) return 'christmas';
  if (between('02-01', '02-14')) return 'valentine';
  if (between('03-06', '03-08')) return 'women';
  const e = easterDate(y); if (dstr >= iso(addDays(e, -7)) && dstr <= iso(addDays(e, 1))) return 'easter';
  const may1 = new Date(y, 4, 1), sun2 = addDays(may1, ((7 - may1.getDay()) % 7) + 7); if (dstr >= iso(addDays(sun2, -6)) && dstr <= iso(sun2)) return 'mothers';
  if (between('05-23', '05-25')) return 'africa';
  const bf = blackFriday(y); if (dstr >= iso(bf) && dstr <= iso(addDays(bf, 3))) return 'blackfriday';
  if (between('10-18', '10-24')) return 'independence';
  return '';
}
