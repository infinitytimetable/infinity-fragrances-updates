  catPNG: () => exportPNG([...document.querySelectorAll('#cat-prev .doc')], `Infinity-Fragrances-catalogue-${UI.cat.date}`),
  adPNG: () => exportPNG([...document.querySelectorAll('#ad-prev .doc')], `Infinity-Fragrances-${UI.ad.tpl}-${UI.ad.size}`, 1),
  adPDF: () => exportPDF([...document.querySelectorAll('#ad-prev .doc')], `Infinity-Fragrances-${UI.ad.tpl}.pdf`),
  toStudio: d => { UI.studioLoad = d.id; ST.product = d.id; if (!imgOf(d.id)) toast(`Upload a photo for ${pName(d.id)}`); location.hash = 'studio'; },
  stAuto: () => stAuto(), stUndo: () => { if (ST.undo.length) { ST.mask = ST.undo.pop(); stDraw(); stOut(); } }, stReset: () => { if (ST.orig) { stPush(); ST.mask = new Uint8Array(ST.w * ST.h); stDraw(); stOut(); } },
  stSave: () => stSave(),
  stDownload: async () => { if (!ST.orig) return toast('Upload a photo first.', true); const blob = await new Promise(r => stFinal().toBlob(r, 'image/jpeg', 0.92)); saveFile(`${ST.product ? pName(ST.product).replace(/\s+/g, '-') : 'perfume'}-white.jpg`, blob); },
  townNew: () => townForm(), townEdit: d => townForm(S.towns[d.id]), townQuick: () => { UI.afterTown = id => resForm({}, id); townForm(); },
  townFilter: d => { UI.town = d.id; UI.status = 'all'; render(); document.getElementById('f-town')?.scrollIntoView({behavior:'smooth', block:'center'}); },
  townDel: d => { const n = Object.values(S.resellers).filter(r => r.townId === d.id).length; if (n) return toast(`Move or delete the ${n} reseller${n > 1 ? 's' : ''} in ${tName(d.id)} first.`, true); confirmBox(`Delete ${esc(tName(d.id))}?`, () => del('towns', d.id)); },
  resNew: d => resForm({}, d.town), resEdit: d => resForm(S.resellers[d.id]), resView: d => resView(d.id),
  resDel: d => { const used = Object.values(S.moves).some(m => m.resellerId === d.id || (m.comm || []).some(c => c.rid === d.id)) || Object.values(S.cash).some(c => c.resellerId === d.id);
    if (used) return toast('This reseller has transactions. Set them to Inactive instead.', true);
    if (children(d.id).length) return toast('Others were recruited by this reseller. Change their recruiter first.', true);
    confirmBox(`Delete ${esc(rName(d.id))}?`, () => del('resellers', d.id)); },
  prodNew: () => prodForm(), prodEdit: d => prodForm(S.products[d.id]),
  prodDel: d => { if (Object.values(S.moves).some(m => m.productId === d.id)) return toast('This product has stock or sales entries and cannot be deleted.', true); confirmBox(`Delete ${esc(pName(d.id))}?`, () => del('products', d.id)); },
  purchase: () => purchaseForm(), issue: d => issueForm(d.id), returnStock: d => returnForm(d.id), adjust: () => adjustForm(),
  saleRes: d => saleResForm(d.id), saleDirect: () => saleDirectForm(),
  moneyIn: d => moneyInForm(d.cat, d.id, d.cust), moneyOut: d => moneyOutForm(d.cat, d.id, d.sup), payComm: d => payCommForm(d.id), transfer: () => transferForm(),
  delMove: d => { const m = S.moves[d.id]; if (!m) return; if (m.receiptId && S.receipts[m.receiptId]) return toast(`This sale is on receipt ${S.receipts[m.receiptId].no}. Void it on the Point of sale page.`, true); if (m.dispatchId && S.dispatches[m.dispatchId]) return toast(`This was sent on ${S.dispatches[m.dispatchId].no}. Delete it from Dispatch & delivery.`, true); confirmBox(`Delete this entry (${m.qty} × ${esc(pName(m.productId))}, ${fmtDate(m.date)})?${m.cashId ? ' Its cash book entry will be deleted too.' : ''}`, async () => { if (m.cashId) await del('cash', m.cashId); await del('moves', d.id); toast('Deleted'); }); },
  delCash: d => { const c = S.cash[d.id]; if (!c) return; if (c.receiptId && S.receipts[c.receiptId]) return toast(`This is receipt ${S.receipts[c.receiptId].no}. Void it on the Point of sale page.`, true); if (c.dispatchId && S.dispatches[c.dispatchId]) return toast('This courier charge belongs to a dispatch. Delete the dispatch instead.', true); if (c.moveId && S.moves[c.moveId]) return toast('This payment belongs to a sale or purchase. Delete it from the Sales or Purchases book.', true); confirmBox(`Delete ${esc(c.category)} of ${money(c.amount)} on ${fmtDate(c.date)}?`, async () => { await del('cash', d.id); toast('Deleted'); }); },
  addLine: (d, b) => { b.previousElementSibling.insertAdjacentHTML('beforeend', lineRow(d.type)); if (b.closest('#est-form')) TOOLS.prospects.input(b.closest('#est-form').querySelector('.line-qty')); },
  rmLine: (d, b) => { const ls = b.closest('.lines'), ef = b.closest('#est-form'); if (ls.children.length > 1) b.closest('.line').remove(); if (ef) TOOLS.prospects.input(ef.querySelector('.line-qty')); },
  addLevel: () => { const l = $('#lv-list'); l.insertAdjacentHTML('beforeend', levelRow({type:'percent', value:1}, l.children.length)); },
  rmLevel: (d, b) => { b.closest('.lv').remove(); [...document.querySelectorAll('#lv-list .lv b')].forEach((x, i) => x.textContent = 'Level ' + (i + 1)); },
  setBiz: bizForm, setComm: commSetForm, setOpening: openingForm,
  backup: () => saveFile(`infinity-fragrances-backup-${today()}.json`, JSON.stringify({...S, exportedAt:nowISO()}, null, 1)),
  csv: d => exportCSV(d.k),
  copyStmt: async () => { const t = $('#f-stmt'); try { await navigator.clipboard.writeText(t.value); toast('Statement copied'); } catch(e) { t.select(); toast('Press and hold to copy the selected text'); } },
};
document.addEventListener('click', e => {
  const sg = e.target.closest('.seg[data-seg] button'), tl = e.target.closest('[data-tool]');
  if (sg && tl) { sg.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === sg)); TOOLS[tl.dataset.tool]?.seg(sg.parentElement.dataset.seg, sg.dataset.v); return; }
  const b = e.target.closest('[data-act]'); if (!b) { if (e.target.id === 'modal') closeModal(); return; }
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f({...b.dataset}, b); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('submit', async e => {
  e.preventDefault(); if (e.target.id !== 'm-form') return;
  const f = e.target, err = $('#m-err'); err.textContent = '';
  if (!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f)); if (f.elements.updCost) d.updCost = f.elements.updCost.checked;
  const sb = f.querySelector('[type=submit]'); sb.disabled = true;
  try { await SUBMIT(d, f); closeModal(); } catch(x) { err.textContent = x.message || 'Something went wrong. Try again.'; sb.disabled = false; }
});
document.addEventListener('change', async e => {
  const t0 = e.target;
  if (t0.id === 'rp-img' && t0.files?.[0]) { try { RES.proof = await shrinkImage(t0.files[0]); const pv = $('#rp-prev'); if (pv) pv.innerHTML = proofPrev(); } catch(x) { toast(x.message, true); } return; }
  if (t0.id === 'rq-all') { document.querySelectorAll('.rq-sel').forEach(c => c.checked = t0.checked); return; }
  if (t0.id === 'f-locks') { await setCfg({lockSecs:num(t0.value)}); toast('Saved'); return; }
  if (t0.id === 'f-bio') { if (t0.checked) { const ok = await DESK.bioAuth('Confirm your fingerprint'); if (!ok) { t0.checked = false; return toast('Fingerprint not confirmed', true); } } await setCfg({bio:t0.checked}); toast(t0.checked ? 'Fingerprint unlock is on' : 'Fingerprint unlock is off'); return; }
  if (t0.id === 'f-alerts') { await setCfg({alerts:t0.checked}); if (t0.checked) alertsSetupFor(FB_ROLE === 'owner' ? 'owner' : 'reseller'); else DESK.alertsStop && DESK.alertsStop(); toast('Saved'); return; }
  if (t0.id === 'f-autor' || t0.id === 'f-autor2') { await putSettings({autoRemind:t0.checked}); toast('Saved'); return; }
  if (t0.id === 'f-admk') { await putSettings({adMarkup:Math.max(0, Math.min(100, num(t0.value)))}); toast('Saved. Resellers see the new limit after the next update.'); return; }
  if (t0.classList?.contains('ad-pick')) { adRead(); const a = adState(), id = t0.dataset.id; if (t0.checked) { if (a.items.length >= 4) { t0.checked = false; return toast('Up to 4 perfumes per poster.', true); } a.items.push({id, price:adBase(id).base}); } else a.items = a.items.filter(x => x.id !== id); render(true); return; }
  if (t0.closest?.('#ad-form')) { adRedraw(); return; }
  if (t0.id === 'f-autoupd') { await setCfg({autoUpd:t0.checked}); toast('Saved'); return; }
  if (t0.id === 'lk-mode') { setLook({mode:t0.value}); return; }
  if (t0.id === 'lk-text') { setLook({text:t0.value}); return; }
  if (t0.id === 'lk-motion') { setLook({motion:t0.checked}); return; }
  if (t0.id === 'f-lowh') { await putSettings({lowHeld:Math.max(0, Math.round(num(t0.value)))}); toast('Saved'); return; }
  const t = e.target;
  if (t.closest('#m-form')) {
    applyWhen();
    if (t.name === 'resellerId') { heldHint(); owesHint(); settleFill(); }
    if (t.name === 'ip') { const pr = t.closest('tr')?.querySelector('[name=ipr]'); if (pr) pr.value = num(S.products[t.value]?.sellPrice); }
    if (t.closest('.line')) t.closest('.line').removeAttribute('data-fresh');
    if (t.classList.contains('line-prod')) { const p = S.products[t.value], type = t.closest('.lines').dataset.type, pr = t.parentElement.querySelector('.line-price'), rid = t.form?.elements.resellerId?.value; if (p && pr) { const base = type === 'purchase' ? num(p.costPrice) : (rid && num(compute().hp?.[rid]?.[p.id])) || num(p.sellPrice), b = type === 'sale' ? bestPromo(p.id, base, rid ? 'resellers' : 'pos', t.form?.elements.date?.value || today()) : null; pr.value = b ? b.price : base; } }
    if (t.name === 'resellerId' && t.form?.querySelector('.lines[data-type=sale]')) { const hp = compute().hp?.[t.value] || {}; t.form.querySelectorAll('.line').forEach(l => { const pid = l.querySelector('.line-prod').value, pr = l.querySelector('.line-price'); if (pr && num(hp[pid])) { const b = bestPromo(pid, num(hp[pid]), 'resellers', t.form.elements.date?.value || today()); pr.value = b ? b.price : num(hp[pid]); } }); }
    return;
  }
  const tl = t.closest('[data-tool]');
  if (tl && (t.tagName === 'SELECT' || ['checkbox','radio','file'].includes(t.type))) { TOOLS[tl.dataset.tool]?.input(t); return; }
  if (t.id === 'f-month') { UI.month = t.value || thisMonth(); render(); }
  if (t.id === 'f-year') { UI.year = t.value; render(); }
  if (t.id === 'f-town') { UI.town = t.value; render(); }
  if (t.id === 'f-status') { UI.status = t.value; render(); }
  if (t.id === 'f-restore' && t.files[0]) restore(t.files[0]);
  if (t.id === 'f-merge' && t.files[0]) { mergeFile(t.files[0]); t.value = ''; }
  if (t.id === 'f-import' && t.files[0]) { importOnline(t.files[0]); t.value = ''; }
  if (t.id === 'log-user') { UI.logf = {...(UI.logf || {}), user:t.value}; render(true); }
  if (t.id === 'log-col') { UI.logf = {...(UI.logf || {}), col:t.value}; render(true); }
  if (t.id === 'f-lockm') putSettings({lockMinutes:Math.max(0, Math.round(num(t.value)))});
  if (t.id === 'f-rpaper') { putSettings({receiptPaper:t.value}); toast('Receipt paper saved'); }
  if (t.id === 'bc-aud') { UI.bc.aud = t.value; UI.bc.msg = BC_TPL[t.value]; render(true); }
  if (t.id === 'f-fest') { putSettings({festive:t.value}); toast(t.value === 'off' ? 'Festive themes turned off' : 'Festive themes on'); }
  if (t.id === 'scan-file' && t.files[0]) onScanFile(t.files[0]);
});
document.addEventListener('input', e => {
  const t = e.target, tl = t.closest('[data-tool]');
  if (tl && t.tagName !== 'SELECT' && !['checkbox','radio','file'].includes(t.type)) { TOOLS[tl.dataset.tool]?.input(t); return; }
  if (t.id === 'f-q') { UI.q = t.value; render(); }
  if (t.id === 'f-oe') UI.fbEmail = t.value; if (t.id === 'r-login') UI.rLogin = t.value; if (t.id === 'ro-n') RES.note = t.value;
  if (t.closest && t.closest('#ad-form') && !t.classList.contains('ad-pick')) adRedraw();
  if (t.id === 'cat-q') { const q = t.value.toLowerCase().trim(); document.querySelectorAll('.cat-card').forEach(c => c.hidden = !!q && !c.dataset.name.includes(q)); }
  if (t.id === 'bc-msg') { UI.bc.msg = t.value; document.querySelectorAll('.bc-go').forEach(a => { const x = bcAudience().find(y => y.id === a.dataset.id); if (x) a.href = waLink(x.phone, bcFill(UI.bc.msg, x)); }); }
});
document.addEventListener('click', e => { const w = e.target.closest('a[data-ps]'); if (w) { const p = S.payslips[w.dataset.ps]; if (p && p.status === 'draft') put('payslips', {...p, status:'sent', sentAt:nowISO(), sentVia:'WhatsApp'}); } });
document.addEventListener('click', e => { if (e.target.closest('.drawer-links a')) setTimeout(closeModal, 0); });
document.addEventListener('click', e => { const a = e.target.closest('.bc-go'); if (a) { UI.bc.sent[a.dataset.id] = true; setTimeout(() => render(true), 300); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lock-pin') tryUnlock(); if (e.key === 'Enter' && e.target.id === 'u-pin') resUnlock(); if (e.key === 'Enter' && e.target.id === 'r-pin') ACT.resIn(); if (e.key === 'Enter' && e.target.id === 'f-op' && !route().startsWith('portal')) ACT.fbOwnerIn(); if (e.key === 'Enter' && e.target.id === 'lic-key') ACT.licActivate(); });

boot();
</script>
